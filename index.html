<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Absence</title>
    <link rel="stylesheet" href="Absence.css">
</head>
<body>
    <form>
        <h1>استمارة حضور</h1>
        <h4>كتابة البيانات باللغة العربية</h4>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5v_9-BIONout4SO9dSQfLkkniUHcAS_zTSH4YpigL9g&s=10" alt="logo ITI">
        <h3>اسم الطالب رباعي: <input type="text" id="studentname" placeholder="*"></h3>
        <h3>رقم التليفون: <input type="tel" id="studentphone" placeholder="*"></h3>
        <h2>what is your gender ?</h2>
        <input type="radio" name="student" value="male">
        <label>male </label><br>
        <input type="radio" name="student" value="female">
        <label>female</label>
        <h2>عمر الطالب :</h2>
        <input type="radio" name="age" value="18-20">
        <label>من18  الي 20</label>
        <br>
        <input type="radio" name="age" value="21-23">
        <label>من 21 الى 23</label>
        <br>
        <input type="radio" name="age" value="24=26">
        <label>من 24 الى 26</label>
        <br>
        <input type="radio" name="age" value="27-30">  
        <label>من 27 الى 30</label>
        <br>
        <input type="radio" name="age" value="اكبر من 30">
        <label>اكبر من 30</label>
        <br>
        <h2>اختر الكلية</h2>
        <input type="radio" name="chose" value="حاسبات">
        <label>كلية حاسبات</label>
        <br>
        <input type="radio" name="chose" value="هندسة">
        <label>كلية هندسة</label>
        <br>
        <input type="radio" name="chose" value="تجارة">   
        <label>كلية تجارة</label>
        <br>
        <input type="radio" name="chose" value="تربية">  
        <label>كلية تربية</label>
        <br>
        <input type="radio" name="chose" value="زراعة"> 
        <label>كلية زراعة</label>
        <br>
        <input type="radio" id="otherradio" name="chose" value="other">
        <input type="text" id="otherinput" placeholder="other">
        <br>
        <br>
        <label>تأكيد</label>
        <input type="checkbox">
        <br>
        <br>
        <button type="button" onclick=" intform()">ارسال</button>
        <input type="Reset" value="Clear" class="btn">

    </form>
    <script src="Absence.js"></script>
    
</body>
</html>
